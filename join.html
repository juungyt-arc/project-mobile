<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입</title>
    <link rel="apple-touch-icon-precomposed" href="./app_icon.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./css/common.css?v=2">
    <link rel="stylesheet" href="./css/sub.css?v=2">
    <link rel="stylesheet" href="./css/member.css">

    <script src="https://kit.fontawesome.com/908fb5e950.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>

     <div id="wrap">
       <header id="headerArea">
       <!-- 헤더영역 로드 -->
       </header>
    <main class="content member_page">
       <article id="content">
            <div class="title_area">
                <h2>회원가입</h2>
            </div>
            <div class="member_box">
                <p class="desc"><span class="req">*</span> 는 필수 입력항목입니다.</p>
                <form action="" method="post" class="join_form">
                    <ul>
                        <li>
                            <label for="memberId">아이디<span class="req">*</span></label>
                            <input type="text" id="memberId" name="memberId" placeholder="ID" required>
                        </li>
                        <li>
                            <label for="memberPass">비밀번호<span class="req">*</span></label>
                            <input type="password" id="memberPass" name="memberPass" placeholder="****" required>
                        </li>
                        <li>
                            <label for="memberPass2">비밀번호확인<span class="req">*</span></label>
                            <input type="password" id="memberPass2" name="memberPass2" placeholder="****" required>
                        </li>
                        <li>
                            <label for="memberName">이름<span class="req">*</span></label>
                            <input type="text" id="memberName" name="memberName" placeholder="성함" required>
                        </li>
                        <li>
                            <label for="memberNick">닉네임<span class="req">*</span></label>
                            <input type="text" id="memberNick" name="memberNick" placeholder="닉네임" required>
                        </li>
                        <li>
                            <!-- 휴대폰은 칸이 3개라 제목은 span, 각 칸에는 숨김 label -->
                            <span class="tit">휴대폰<span class="req">*</span></span>
                            <div class="row">
                                <label for="hp1" class="hidden">전화번호국번</label>
                                <select name="hp1" id="hp1">
                                    <option value="010">010</option>
                                    <option value="02">02</option>
                                    <option value="031">031</option>
                                    <option value="011">011</option>
                                    <option value="016">016</option>
                                </select>
                                <span>-</span>
                                <label for="hp2" class="hidden">전화번호중간4자리</label>
                                <input type="text" id="hp2" name="hp2" placeholder="1234" required>
                                <span>-</span>
                                <label for="hp3" class="hidden">전화번호끝4자리</label>
                                <input type="text" id="hp3" name="hp3" placeholder="5678" required>
                            </div>
                        </li>
                        <li>
                            <span class="tit">이메일<span class="req">*</span></span>
                            <div class="row">
                                <label for="mail1" class="hidden">이메일아이디</label>
                                <input type="text" id="mail1" name="mail1" placeholder="email" required>
                                <span>@</span>
                                <label for="mail2" class="hidden">이메일계정</label>
                                <input type="text" id="mail2" name="mail2" placeholder="naver.com" required>
                            </div>
                        </li>
                    </ul>
                    <div class="btn_wrap">
                        <input type="submit" value="회원가입" class="btn_main">
                        <input type="reset" value="다시쓰기" class="btn_line">
                    </div>
                </form>
            </div>
       </article>
    </main>
       <footer id="footerArea">
        <!-- 푸터영역 로드 -->
       </footer>

     </div>

    <script src="./js/jquery-1.12.4.min.js"></script>
    <script src="./js/jquery-migrate-1.4.1.min.js"></script>

   <script>
        $('#headerArea').load('./common/header.html',function(){
            //header.html의 로드가 완료되면.. footer 로드
            $('#footerArea').load('./common/footer.html',function(){
                //footer.html까지 로드가 완료되면.. 공통 js 실행
                $.getScript('./js/common.js');
            });
        });
    </script>
</body>
</html>
