<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인</title>
    <link rel="apple-touch-icon-precomposed" href="./app_icon.png">

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200">
    <link rel="stylesheet" href="./css/common.css?v=2">
    <link rel="stylesheet" href="./css/sub.css?v=2">
    <link rel="stylesheet" href="./css/member.css">

    <script src="https://kit.fontawesome.com/908fb5e950.js" crossorigin="anonymous"></script>
</head>
<body>
    <div id="skipNav">
        <a href="#content">본문바로가기</a>
        <a href="#gnb">네비게이션바로가기</a>
    </div>

     <div id="wrap">
       <header id="headerArea">
       <!-- 헤더영역 로드 -->
       </header>
    <main class="content member_page">
       <article id="content">
            <div class="title_area">
                <h2>로그인</h2>
            </div>
            <div class="member_box">
                <p class="desc">회원가입 시 등록한 아이디와 비밀번호를 입력해주세요.</p>
                <form action="" method="get" class="login_form">
                    <div class="field">
                        <label for="id">아이디</label>
                        <input type="text" id="id" name="id" placeholder="user-id">
                    </div>
                    <div class="field">
                        <label for="pass">비밀번호</label>
                        <input type="password" id="pass" name="pass" placeholder="*******">
                    </div>
                    <input type="submit" value="로그인" class="btn_main">
                </form>

                <div class="login_find">
                    <a href="#">아이디찾기</a>
                    <a href="#">비밀번호찾기</a>
                </div>

                <div class="login_join">
                    <span>아직 회원이 아니신가요?</span>
                    <a href="./member_check.html">회원가입</a>
                </div>
            </div>
       </article>
    </main>
       <footer id="footerArea">
        <!-- 푸터영역 로드 -->
       </footer>

     </div>

    <script src="./js/jquery-1.12.4.min.js"></script>
    <script src="./js/jquery-migrate-1.4.1.min.js"></script>

   <script>
        $('#headerArea').load('./common/header.html',function(){
            //header.html의 로드가 완료되면.. footer 로드
            $('#footerArea').load('./common/footer.html',function(){
                //footer.html까지 로드가 완료되면.. 공통 js 실행
                $.getScript('./js/common.js');
            });
        });
    </script>
</body>
</html>
